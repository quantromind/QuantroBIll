services:
  api:
    build:
      context: .
      dockerfile: src/PetBharke.API/Dockerfile
    container_name: petbharke-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__DatabaseName=${MONGODB_DATABASE_NAME:-petbharke}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-PetBharkeAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-PetBharkeClient}
      - AllowedOrigins__0=${ALLOWED_ORIGIN_0:-http://localhost:5173}
      - Swagger__Enabled=${SWAGGER_ENABLED:-false}
    ports:
      - "5000:8080"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: petbharke-client
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
