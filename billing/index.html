<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to QuantroBill POS...</title>
  <script>
    const isLiveServer = window.location.port === '5500' || window.location.protocol === 'file:';
    const targetUrl = isLiveServer ? ('http://localhost:5173/billing' + window.location.search + window.location.hash) : ('/billing' + window.location.search + window.location.hash);
    window.location.replace(targetUrl);
  </script>
  <style>
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2.5rem;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    h2 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #0f172a; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">🧾</div>
    <h2>Redirecting to QuantroBill POS...</h2>
    <p>Navigating to Billing POS interface.</p>
    <a id="redirectLink" class="btn" href="/billing">Click here if not redirected</a>
  </div>
  <script>
    const isLive = window.location.port === '5500' || window.location.protocol === 'file:';
    document.getElementById('redirectLink').href = isLive ? 'http://localhost:5173/billing' : '/billing';
  </script>
</body>
</html>
